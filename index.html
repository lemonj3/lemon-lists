<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lemon Lists</title>
  <meta property="og:title" content="Lemon Lists 🍋" />
  <meta property="og:description" content="쇼핑·라이프·업무·보고싶은것·가고싶은곳 리스트 관리 앱" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Lists" />
  <meta name="theme-color" content="#FFF9C4" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ═══════════════════════════════════════
       THEMES — 7가지 팔레트 기반
       톤 계층: t0(배경) → t1(칩) → t2(버튼) → t3(탭 활성)
       단계 격차를 최소화해 자연스럽게
    ═══════════════════════════════════════ */

    /* 🤍 소프트 화이트 — 흑백 미니멀 */
    [data-theme="white"] {
      --t0:     #FDFCFF;
      --t1:     #F0EFED;
      --t2:     #3D3D3D;
      --t3:     #1C1C1C;
      --t-txt:  #FFFFFF;
      --surface:#FFFFFF;
      --border: #E8E8E6;
      --text:   #1C1C1C;
      --muted:  #909090;
      --shadow: 0 2px 12px rgba(0,0,0,.06);
      --struct: #3D3D3D;
      --struct-dk:#1C1C1C;
      --done:   #B0B0B0;
      --danger: #c0856a;
    }

    /* 🌸 파스텔 핑크 */
    [data-theme="pink"] {
      --t0:     #FEF8F9;
      --t1:     #F9DDE4;
      --t2:     #F2C4CE;
      --t3:     #E8A8B6;
      --t-txt:  #6a2838;
      --surface:#FFFFFF;
      --border: #F5D4DC;
      --text:   #3D2028;
      --muted:  #B88898;
      --shadow: 0 4px 20px rgba(200,100,130,.08);
      --struct: #D08898;
      --struct-dk:#8a4858;
      --done:   #F2C4CE;
      --danger: #c06060;
    }

    /* 🌿 파스텔 그린 */
    [data-theme="green"] {
      --t0:     #F5FAF5;
      --t1:     #DCF0DC;
      --t2:     #C8E6C9;
      --t3:     #AED6B0;
      --t-txt:  #2a4a2c;
      --surface:#FFFFFF;
      --border: #D4ECD5;
      --text:   #283828;
      --muted:  #80A882;
      --shadow: 0 4px 20px rgba(80,160,90,.08);
      --struct: #7CB880;
      --struct-dk:#3a6840;
      --done:   #C8E6C9;
      --danger: #c0856a;
    }

    /* 🍋 파스텔 레몬 (기본) */
    [data-theme="lemon"] {
      --t0:     #FEFDF0;
      --t1:     #FFF9C4;
      --t2:     #FFF098;
      --t3:     #FFE566;
      --t-txt:  #4a3a00;
      --surface:#FFFFFF;
      --border: #F0EAB0;
      --text:   #3D3820;
      --muted:  #A89860;
      --shadow: 0 4px 20px rgba(180,160,40,.08);
      --struct: #B8A040;
      --struct-dk:#6a5800;
      --done:   #C8D898;
      --danger: #c0856a;
    }

    /* 🩵 파스텔 블루 */
    [data-theme="blue"] {
      --t0:     #F5F9FF;
      --t1:     #D8EEFF;
      --t2:     #BBDEFB;
      --t3:     #98CCF8;
      --t-txt:  #183060;
      --surface:#FFFFFF;
      --border: #CCE8FA;
      --text:   #1a2a48;
      --muted:  #6888B0;
      --shadow: 0 4px 20px rgba(80,140,220,.08);
      --struct: #68A8D8;
      --struct-dk:#2860A0;
      --done:   #BBDEFB;
      --danger: #c0856a;
    }

    /* 💜 파스텔 라벤더 */
    [data-theme="lavender"] {
      --t0:     #FAF8FF;
      --t1:     #F0EAF8;
      --t2:     #EDE7F6;
      --t3:     #D8CEEE;
      --t-txt:  #3a2860;
      --surface:#FFFFFF;
      --border: #E4DCF4;
      --text:   #302848;
      --muted:  #9880B8;
      --shadow: 0 4px 20px rgba(140,100,200,.08);
      --struct: #9878C8;
      --struct-dk:#5838A0;
      --done:   #D8CEEE;
      --danger: #c0856a;
    }

    /* ☁️ 소프트 그레이 */
    [data-theme="gray"] {
      --t0:     #F8F8F7;
      --t1:     #F0EFED;
      --t2:     #E0DEDB;
      --t3:     #C8C5C0;
      --t-txt:  #383530;
      --surface:#FFFFFF;
      --border: #E8E6E2;
      --text:   #3D3D38;
      --muted:  #989590;
      --shadow: 0 4px 20px rgba(120,118,110,.08);
      --struct: #888480;
      --struct-dk:#484440;
      --done:   #C8C5C0;
      --danger: #c0856a;
    }

    /* ═══════════════════════════════════════
       BASE STYLES
    ═══════════════════════════════════════ */
    body {
      font-family: 'Pretendard', 'Segoe UI', system-ui, sans-serif;
      background: var(--t0);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 80px;
      transition: background .3s, color .3s;
    }
    .app { max-width: 600px; margin: 0 auto; }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 28px; position: relative; }
    .header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.5px; color: var(--text); font-family: 'Gaegu', cursive; }
    .header h1 span { color: var(--struct); }
    .today-badge {
      display: inline-block;
      background: var(--t1); color: var(--t-txt);
      font-size: .85rem; font-weight: 700;
      padding: 3px 12px; border-radius: 20px; margin-top: 6px;
      border: 1px solid var(--t2);
      font-family: 'Gaegu', cursive;
    }

    /* 테마 버튼 */
    .theme-btn {
      position: absolute; top: 4px; right: 0;
      background: var(--t1); border: 1.5px solid var(--t2);
      border-radius: 12px; padding: 6px 8px;
      cursor: pointer; transition: all .15s;
      display: flex; align-items: center; gap: 4px;
      font-size: .72rem; font-weight: 700; color: var(--t-txt);
    }
    .theme-btn:hover { background: var(--t2); }
    .theme-btn svg { width: 14px; height: 14px; stroke: var(--t-txt); }

    /* 테마 패널 */
    .theme-panel {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.3); z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
      padding: 16px;
    }
    .theme-panel.hidden { display: none; }
    .theme-inner {
      background: var(--surface); border-radius: 24px 24px 20px 20px;
      padding: 24px; width: 100%; max-width: 600px;
      box-shadow: 0 -4px 40px rgba(0,0,0,.15);
    }
    .theme-inner h3 { font-size: .9rem; font-weight: 800; color: var(--text); margin-bottom: 16px; }
    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-option {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 8px; border-radius: 16px; cursor: pointer;
      border: 2.5px solid transparent; transition: all .15s;
    }
    .theme-option:hover { border-color: var(--t3); }
    .theme-option.selected { border-color: var(--struct); }
    .theme-swatch {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid rgba(0,0,0,.08);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .theme-option span { font-size: .72rem; font-weight: 700; color: var(--text); }
    .theme-close {
      width: 100%; margin-top: 14px; padding: 11px;
      background: var(--t1); color: var(--t-txt);
      border: 1.5px solid var(--t2); border-radius: 12px;
      font-size: .88rem; font-weight: 700; cursor: pointer;
    }
    .theme-close:hover { background: var(--t2); }

    /* ── Category Tabs ── */
    .tabs {
      display: flex; flex-wrap: nowrap;
      gap: 6px; margin-bottom: 16px;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 4px; flex: 1;
      border: 2px solid var(--border); border-radius: 16px;
      cursor: pointer; background: var(--surface);
      box-shadow: var(--shadow); transition: all .18s;
      font-size: .75rem; font-weight: 700; color: var(--muted);
      font-family: 'Gaegu', cursive;
      position: relative;
    }
    .tab svg { width: 18px; height: 18px; stroke: var(--muted); transition: stroke .18s; }
    /* 탭 라벨은 절대 두 줄로 쪼개지지 않게 (탭 높이가 들쭉날쭉해지는 것 방지) */
    .tab span:not(.badge) { white-space: nowrap; }
    /* 탭이 6개라 좁은 화면에서는 글자를 줄여 한 줄에 맞춘다 */
    @media (max-width: 480px) {
      .tabs { gap: 4px; }
      .tab { padding: 10px 2px; }
      .tab span:not(.badge) { font-size: .6rem; }
    }
    .tab.active { border-color: var(--t3); background: var(--t3); color: var(--t-txt); }
    .tab.active svg { stroke: var(--t-txt); }
    .tab:not(.active):hover { border-color: var(--t2); background: var(--t1); color: var(--t-txt); }
    .tab:not(.active):hover svg { stroke: var(--t-txt); }
    .tab .badge {
      position: absolute; top: 4px; right: 6px;
      background: var(--danger); color: #fff;
      font-size: .6rem; font-weight: 700;
      min-width: 14px; height: 14px; border-radius: 7px;
      display: flex; align-items: center; justify-content: center; padding: 0 3px;
    }

    /* ── Stats Pills ── */
    .stats { display: flex; gap: 6px; margin-bottom: 14px; align-items: center; }
    .stat-pill {
      flex: 1; min-width: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 6px 6px;
      text-align: center; cursor: pointer; transition: all .18s; user-select: none;
    }
    .stat-pill:hover { border-color: var(--t2); background: var(--t1); }
    .stat-pill.active { background: var(--t2); border-color: var(--t3); }
    .stat-pill.active .stat-num,
    .stat-pill.active .stat-lbl { color: var(--t-txt); }
    .stat-num { font-size: 1.1rem; font-weight: 800; color: var(--text); font-family: 'Gaegu', cursive; }
    .stat-lbl { font-size: .68rem; color: var(--muted); font-weight: 700; font-family: 'Gaegu', cursive; }
    .stat-pill.overdue-pill { background: #fdf0ea; }
    .stat-pill.overdue-pill .stat-num { color: var(--danger); }
    .stat-pill.overdue-pill.active { background: var(--danger); border-color: #9a6050; }
    .stat-pill.overdue-pill.active .stat-num,
    .stat-pill.overdue-pill.active .stat-lbl { color: #fff; }

    /* ── 선택 삭제 ── */
    .list-toolbar { min-height: 0; margin-bottom: 0; }
    .item-card.selectable { cursor: pointer; user-select: none; }
    .item-card.sel-selected { border-color: var(--t3); background: var(--t1); }
    .item-select-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s; margin-right: 4px;
      font-size: .82rem; font-weight: 700;
    }
    .item-card.sel-selected .item-select-check {
      background: var(--t3); border-color: var(--t3); color: var(--t-txt);
    }
    /* 하단 선택 액션바 */
    .sel-action-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 560px;
      background: var(--surface); border-top: 1.5px solid var(--border);
      padding: 12px 20px 20px; display: flex; gap: 8px; align-items: center;
      box-shadow: 0 -4px 20px rgba(0,0,0,.08); z-index: 100;
    }
    .sel-all-btn {
      flex: 1; padding: 10px; font-size: .85rem; font-weight: 700;
      background: var(--t1); border: 1.5px solid var(--t2); border-radius: 12px;
      cursor: pointer; font-family: 'Gaegu', cursive; color: var(--text);
    }
    .sel-delete-btn {
      flex: 1; padding: 10px; font-size: .85rem; font-weight: 700;
      background: none; border: 1.5px solid var(--danger); border-radius: 12px;
      color: var(--danger); cursor: pointer; font-family: 'Gaegu', cursive; transition: all .15s;
    }
    .sel-delete-btn:hover { background: var(--danger); color: #fff; }
    .sel-delete-btn:disabled { opacity: .4; pointer-events: none; }
    .sel-cancel-btn {
      padding: 10px 14px; font-size: .85rem; color: var(--muted);
      background: none; border: none; cursor: pointer; font-family: inherit;
    }
    .sel-hint {
      text-align: center; font-size: .72rem; color: var(--muted);
      padding: 6px 0 0; letter-spacing: .3px;
    }
    .move-panel {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 560px; z-index: 200;
      background: var(--surface); border-top: 1.5px solid var(--border);
      padding: 16px 20px 24px; box-shadow: 0 -4px 20px rgba(0,0,0,.12);
    }
    .move-panel h4 { font-size: .85rem; color: var(--muted); margin-bottom: 12px; font-family: 'Gaegu', cursive; text-align: center; }
    .move-cat-list { display: flex; flex-direction: column; gap: 8px; }
    .move-cat-btn {
      padding: 11px 16px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--t0); font-size: .9rem; font-weight: 700; cursor: pointer;
      font-family: 'Gaegu', cursive; color: var(--text); text-align: left;
      transition: all .15s; display: flex; align-items: center; gap: 10px;
    }
    .move-cat-btn:hover { background: var(--t2); border-color: var(--t3); }
    .move-cat-btn.current { opacity: .35; pointer-events: none; }
    .move-cancel { width: 100%; margin-top: 8px; padding: 10px; background: none; border: none; color: var(--muted); font-size: .85rem; cursor: pointer; font-family: inherit; }

    /* ── Lock Screen ── */
    #lockScreen {
      position: fixed; inset: 0; background: #FEFDF0;
      display: flex; align-items: center; justify-content: center; z-index: 9999;
    }
    .lock-box {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 40px 32px; background: #fff; border-radius: 24px;
      box-shadow: 0 4px 30px rgba(0,0,0,.08); width: 280px;
    }
    .lock-icon { font-size: 48px; }
    .lock-box h2 { font-family: 'Gaegu', cursive; font-size: 1.6rem; color: #3D3820; }
    .lock-box input {
      width: 100%; padding: 12px 16px; border: 1.5px solid #F0EAB0;
      border-radius: 12px; font-size: 1rem; text-align: center;
      outline: none; font-family: inherit;
    }
    .lock-box input:focus { border-color: #FFE566; }
    .lock-box button {
      width: 100%; padding: 12px; background: #FFE566; border: none;
      border-radius: 12px; font-size: 1rem; font-weight: 600;
      cursor: pointer; font-family: 'Gaegu', cursive; font-size: 1.1rem;
      color: #4a3a00;
    }
    .lock-box button:active { background: #FFD700; }

    /* ── Add Form ── */
    .add-form {
      background: var(--surface); border-radius: 20px; padding: 16px;
      box-shadow: var(--shadow); margin-bottom: 20px;
      display: flex; flex-direction: column; gap: 10px;
      border: 1.5px solid var(--border);
    }
    .add-form .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .add-form input, .add-form select {
      flex: 1; min-width: 0; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: .88rem; color: var(--text);
      background: var(--t0); outline: none;
      transition: border .15s; font-family: inherit;
    }
    .add-form input:focus, .add-form select:focus { border-color: var(--t3); }
    .add-form input[type="text"] { flex: 2; }
    .add-btn {
      width: 100%; padding: 11px;
      background: var(--t2); color: var(--t-txt);
      border: 1.5px solid var(--t3); border-radius: 12px;
      font-size: 1rem; font-weight: 700; cursor: pointer; transition: all .15s;
      font-family: 'Gaegu', cursive;
    }
    .add-btn:hover { background: var(--t3); }
    .add-btn:active { transform: scale(.98); }

    /* ── Item Cards ── */
    .items-list { display: flex; flex-direction: column; gap: 10px; }
    .empty-state { text-align: center; padding: 48px 0; color: var(--muted); font-size: .9rem; }
    .empty-state .e { font-size: 2.5rem; display: block; margin-bottom: 10px; }

    .item-card {
      background: var(--surface); border-radius: 16px; padding: 14px 16px;
      box-shadow: var(--shadow);
      display: flex; align-items: flex-start; gap: 12px;
      border: 1.5px solid var(--border); border-left: 4px solid var(--struct);
      transition: opacity .2s;
    }
    .item-card.done   { opacity: .5; }
    .item-card.overdue { border-left-color: var(--danger); }

    .check-btn {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); background: transparent;
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .check-btn:hover { border-color: var(--done); background: var(--done); }
    .check-btn.checked { background: var(--done); border-color: var(--struct); }
    .check-btn.checked::after { content: '✓'; color: #fff; font-size: .75rem; font-weight: 800; }

    .item-body { flex: 1; min-width: 0; }
    .item-text { font-size: .9rem; font-weight: 600; word-break: break-word; color: var(--text); }
    .item-text.done-text { text-decoration: line-through; color: var(--done); }

    .item-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
    .meta-chip {
      font-size: .7rem; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; background: var(--t0); color: var(--muted); border: 1px solid var(--border);
    }
    .dday-chip { font-size: .7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .dday-chip.ok    { background: #ddeee0; color: var(--struct-dk); }
    .dday-chip.soon  { background: var(--t1); color: var(--t-txt); }
    .dday-chip.over  { background: #f5e0d8; color: var(--danger); }
    .dday-chip.today { background: var(--t2); color: var(--t-txt); border: 1px solid var(--t3); }

    .sub-chip { font-size: .68rem; padding: 1px 7px; border-radius: 8px; font-weight: 700; }
    .priority-high   { background: #f5e0d8; color: var(--danger); }
    .priority-medium { background: var(--t1); color: var(--t-txt); }
    .priority-low    { background: #ddeee0; color: var(--struct-dk); }
    .media-movie  { background: #ddeee0; color: var(--struct-dk); }
    .media-drama  { background: var(--t1); color: var(--t-txt); }
    .media-book   { background: #e8e4f0; color: #5a4a80; }
    .qty-badge { font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 8px; background: var(--t1); color: var(--t-txt); border: 1px solid var(--t2); }

    .delete-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.1rem; padding: 2px 4px;
      border-radius: 8px; transition: color .15s, background .15s; flex-shrink: 0;
    }
    .delete-btn:hover { color: var(--danger); }

    /* ── 기한 편집 ── */
    .due-chip-btn {
      font-size: .7rem; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; background: var(--t0); color: var(--muted);
      border: 1px solid var(--border); cursor: pointer; transition: all .15s;
    }
    .due-chip-btn:hover { border-color: var(--t3); background: var(--t1); color: var(--t-txt); }
    .due-chip-btn.no-due { border-style: dashed; }
    .pri-chip-btn {
      font-size: .7rem; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; border: 1px solid transparent;
      cursor: pointer; font-family: inherit; transition: all .15s;
    }
    .pri-chip-btn:hover { border-color: var(--t3); }

    /* ── 기도 ── */
    .pray-chip-btn {
      font-size: .7rem; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; cursor: pointer; font-family: inherit;
      border: 1px solid var(--border); background: var(--t0); color: var(--muted);
      transition: all .15s;
    }
    .pray-chip-btn:hover { border-color: var(--t3); }
    .pray-chip-btn.pray-praying  { background: var(--t1); color: var(--t-txt); border-color: var(--t3); }
    .pray-chip-btn.pray-answered { background: #ddeee0; color: var(--struct-dk); border-color: #a8ccb0; }
    .pray-chip-btn.pray-closed   { background: none; color: var(--muted); }
    /* 응답 항목은 흐리게 하지 않고, 왼쪽 테두리로 표시만 남긴다 */
    .item-card.pray-answered { border-left-color: #7CB880; }

    .notes-panel {
      margin-top: 8px; padding: 8px 10px;
      background: var(--t0); border: 1px solid var(--border); border-radius: 12px;
    }
    .note-item {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 4px 0; border-bottom: 1px dashed var(--border);
    }
    .note-item:last-of-type { border-bottom: none; }
    .note-date {
      font-size: .65rem; font-weight: 700; color: var(--muted);
      flex-shrink: 0; padding-top: 2px; min-width: 62px;
    }
    .note-text {
      font-size: .8rem; color: var(--text); flex: 1;
      word-break: break-word; white-space: pre-wrap;
    }
    .note-del {
      background: none; border: none; color: var(--muted);
      font-size: .9rem; line-height: 1; cursor: pointer; flex-shrink: 0; padding: 2px 4px;
    }
    .note-del:hover { color: var(--danger); }
    .note-add { display: flex; gap: 6px; margin-top: 8px; }
    .note-add input {
      flex: 1; min-width: 0; padding: 6px 10px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: .8rem; color: var(--text); background: var(--surface);
      outline: none; font-family: inherit;
    }
    .note-add input:focus { border-color: var(--t3); }
    .check-btn.answered { background: #ddeee0; border-color: #7CB880; }
    .check-btn.answered::after { content: '✓'; color: #4a7a52; font-size: .75rem; font-weight: 800; }

    /* ── 택배 ── */
    .ship-check {
      display: flex; align-items: center; gap: 4px; padding: 0 8px;
      font-size: .8rem; color: var(--muted); cursor: pointer;
      white-space: nowrap; user-select: none;
    }
    .ship-check input { cursor: pointer; accent-color: var(--t3); }
    .ship-chip { background: var(--t1); color: var(--t-txt); }
    .ship-chip-btn {
      font-size: .7rem; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; background: var(--t1); color: var(--t-txt);
      border: 1px solid var(--t3); cursor: pointer;
      font-family: inherit; transition: all .15s;
    }
    .ship-chip-btn:hover { background: var(--t2); }
    .ship-chip-btn.arrived { background: none; color: var(--muted); border-color: var(--border); }
    .due-edit-row input[type="text"] {
      padding: 4px 8px; border: 1.5px solid var(--t3); border-radius: 10px;
      font-size: .78rem; color: var(--text); background: var(--surface);
      outline: none; font-family: inherit; min-width: 100px; flex: 1;
    }
    .due-edit-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .due-edit-row input[type="date"] {
      padding: 4px 8px; border: 1.5px solid var(--t3); border-radius: 10px;
      font-size: .78rem; color: var(--text); background: var(--surface);
      outline: none; font-family: inherit;
    }
    .bulk-delete-btn { margin-top: 8px; padding: 6px 16px; background: none; border: 1.5px solid var(--danger); color: var(--danger); border-radius: 20px; font-size: .78rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .15s; }
    .bulk-delete-btn:hover { background: var(--danger); color: #fff; }
    .due-save-btn   { padding: 4px 10px; background: var(--t2); color: var(--t-txt); border: 1px solid var(--t3); border-radius: 8px; font-size: .75rem; font-weight: 700; cursor: pointer; }
    .due-clear-btn  { padding: 4px 8px; background: none; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; font-size: .75rem; cursor: pointer; }
    .due-cancel-btn { padding: 4px 8px; background: none; color: var(--muted); border: none; font-size: .75rem; cursor: pointer; text-decoration: underline; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--t2); border-radius: 3px; }
  </style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🍋</div>
    <h2>Lemon Lists</h2>
    <input type="password" id="pwInput" placeholder="비밀번호 입력" autocomplete="current-password" />
    <button onclick="tryUnlock()">확인</button>
    <p id="pwError" style="color:#c06060;font-size:13px;margin-top:8px;display:none">비밀번호가 틀렸어요</p>

</div>

<div class="app" id="app" style="display:none">
  <div class="header">
    <h1>Lemon <span>Lists</span> 🍋</h1>
    <div class="today-badge" id="todayBadge"></div>
    <button class="theme-btn" onclick="openTheme()">
      <i data-lucide="palette"></i> 테마
    </button>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cat="shop" onclick="switchCat('shop')">
      <i data-lucide="shopping-cart"></i><span>쇼핑</span>
      <span class="badge" id="badge-shop" style="display:none"></span>
    </div>
    <div class="tab" data-cat="life" onclick="switchCat('life')">
      <i data-lucide="leaf"></i><span>라이프</span>
      <span class="badge" id="badge-life" style="display:none"></span>
    </div>
    <div class="tab" data-cat="work" onclick="switchCat('work')">
      <i data-lucide="briefcase"></i><span>업무</span>
      <span class="badge" id="badge-work" style="display:none"></span>
    </div>
    <div class="tab" data-cat="media" onclick="switchCat('media')">
      <i data-lucide="clapperboard"></i><span>보고싶은것</span>
      <span class="badge" id="badge-media" style="display:none"></span>
    </div>
    <div class="tab" data-cat="place" onclick="switchCat('place')">
      <i data-lucide="map-pin"></i><span>가고싶은곳</span>
      <span class="badge" id="badge-place" style="display:none"></span>
    </div>
    <div class="tab" data-cat="pray" onclick="switchCat('pray')">
      <i data-lucide="hand-heart"></i><span>기도</span>
      <span class="badge" id="badge-pray" style="display:none"></span>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="add-form" id="addForm"></div>
  <div class="list-toolbar" id="listToolbar"></div>
  <div class="items-list" id="itemsList"></div>
</div>

<!-- 테마 패널 -->
<div class="theme-panel hidden" id="themePanel" onclick="handlePanelClick(event)">
  <div class="theme-inner">
    <h3>🎨 테마 선택</h3>
    <div class="theme-grid" id="themeGrid"></div>
    <button class="theme-close" onclick="closeTheme()">닫기</button>
  </div>
</div>

<script>
// ── 테마 정의 ────────────────────────────────────────────
const THEMES = [
  { key: 'lemon',    label: '파스텔 레몬',   swatch: '#FFF9C4', emoji: '🍋' },
  { key: 'pink',     label: '파스텔 핑크',   swatch: '#F2C4CE', emoji: '🌸' },
  { key: 'green',    label: '파스텔 그린',   swatch: '#C8E6C9', emoji: '🌿' },
  { key: 'blue',     label: '파스텔 블루',   swatch: '#BBDEFB', emoji: '🩵' },
  { key: 'lavender', label: '파스텔 라벤더', swatch: '#EDE7F6', emoji: '💜' },
  { key: 'white',    label: '소프트 화이트', swatch: '#FDFCFF', emoji: '🤍' },
  { key: 'gray',     label: '소프트 그레이', swatch: '#F0EFED', emoji: '☁️' },
];

let currentTheme = localStorage.getItem('myListsTheme') || 'lemon';

// 상태바 색 요청.
// 기존 meta 태그의 content만 바꾸면 안드로이드 크롬이 무시하는 경우가 있어서,
// 태그를 지우고 새로 꽂아 넣어 브라우저가 다시 읽게 만든다.
function setStatusBarColor(color) {
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove());
  const m = document.createElement('meta');
  m.setAttribute('name', 'theme-color');
  m.setAttribute('content', color);
  document.head.appendChild(m);
}

function applyTheme(key) {
  document.documentElement.setAttribute('data-theme', key);
  currentTheme = key;
  localStorage.setItem('myListsTheme', key);
  const t = THEMES.find(t => t.key === key);
  if (t) setStatusBarColor(t.swatch);
}

function openTheme() {
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = THEMES.map(t => `
    <div class="theme-option${t.key === currentTheme ? ' selected' : ''}"
         onclick="pickTheme('${t.key}')">
      <div class="theme-swatch" style="background:${t.swatch}">${t.emoji}</div>
      <span>${t.label}</span>
    </div>`).join('');
  document.getElementById('themePanel').classList.remove('hidden');
}

function pickTheme(key) {
  applyTheme(key);
  lucide.createIcons();
  // 선택 표시 갱신
  document.querySelectorAll('.theme-option').forEach(el => {
    el.classList.toggle('selected', el.onclick.toString().includes(`'${key}'`));
  });
  openTheme(); // 리렌더
}

function closeTheme() {
  document.getElementById('themePanel').classList.add('hidden');
}

function handlePanelClick(e) {
  if (e.target === document.getElementById('themePanel')) closeTheme();
}

// ── Supabase ──────────────────────────────────────────────
const _SB = supabase.createClient(
  'https://stbhvcfubdhzwbdzeyvu.supabase.co',
  'sb_publishable_1IUbpDSIlM_YRiEkmcXhhQ_fC792Aqn'
);

// ── 데이터 ───────────────────────────────────────────────
let items = [];
let currentCat = 'shop';
let currentFilter = 'active';
let selectMode = false;
let selectedIds = new Set();
let notesOpen = new Set();
let autoFocusForm = false;

async function loadItems() {
  const { data } = await _SB.from('todos').select('*').order('id', { ascending: false });
  items = data || [];
  render();
}

async function dbAdd(item) {
  await _SB.from('todos').insert(item);
}
async function dbUpdate(id, changes) {
  await _SB.from('todos').update(changes).eq('id', id);
}
async function dbDelete(id) {
  await _SB.from('todos').delete().eq('id', id);
}

function todayStr() { return new Date().toISOString().slice(0,10); }
function formatDate(str) {
  if (!str) return null;
  const [y,m,d] = str.split('-');
  return `${y}.${m}.${d}`;
}
function dday(str) {
  if (!str) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(str); due.setHours(0,0,0,0);
  return Math.round((due - today) / 86400000);
}
function ddayLabel(str) {
  const d = dday(str);
  if (d === 0) return { text: 'D-Day', cls: 'today' };
  if (d > 0)   return { text: `D-${d}`, cls: d <= 3 ? 'soon' : 'ok' };
  return { text: `D+${Math.abs(d)} 초과`, cls: 'over' };
}
function elapsed(created) {
  const diff = Math.round((new Date() - new Date(created)) / 86400000);
  if (diff === 0) return '오늘 추가';
  if (diff === 1) return '어제 추가';
  return `${diff}일 전 추가`;
}

// ── 렌더 ─────────────────────────────────────────────────
function render() {
  renderTodayBadge();
  renderTabs();
  renderStats();
  renderForm();
  renderToolbar();
  renderList();
  lucide.createIcons();
  attachLongPress();
}

function attachLongPress() {
  if (selectMode) return;
  document.querySelectorAll('.item-card[data-id]').forEach(card => {
    let timer = null;
    const start = (e) => {
      if (e.target.closest('button')) return;
      timer = setTimeout(() => {
        const id = card.dataset.id;
        enterSelectMode();
        toggleSelect(id);
      }, 500);
    };
    const cancel = () => { clearTimeout(timer); timer = null; };
    card.addEventListener('mousedown', start);
    card.addEventListener('mouseup', cancel);
    card.addEventListener('mouseleave', cancel);
    card.addEventListener('touchstart', start, {passive: true});
    card.addEventListener('touchend', cancel);
    card.addEventListener('touchmove', cancel);
  });
}

function renderToolbar() {
  document.getElementById('listToolbar').innerHTML = '';
  const existing = document.getElementById('selActionBar');
  if (existing) existing.remove();
  if (!selectMode) return;
  const n = selectedIds.size;
  const allVisible = getFiltered().map(i => i.id);
  const allSelected = allVisible.length > 0 && allVisible.every(id => selectedIds.has(id));
  const bar = document.createElement('div');
  bar.id = 'selActionBar';
  bar.className = 'sel-action-bar';
  bar.innerHTML = `
    <button class="sel-cancel-btn" onclick="exitSelectMode()">취소</button>
    <button class="sel-all-btn" onclick="toggleSelectAll()">${allSelected ? '전체 해제' : '전체 선택'}</button>
    <button class="sel-all-btn" onclick="openMovePanel()" ${n===0?'disabled':''} style="opacity:${n===0?.4:1}">이동 ${n>0?`(${n}개)`:''}</button>
    <button class="sel-delete-btn" onclick="deleteSelected()" ${n===0?'disabled':''}>삭제 ${n>0?`(${n}개)`:''}</button>`;
  document.body.appendChild(bar);
}

function renderTodayBadge() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('todayBadge').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`;
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.className = 'tab' + (t.dataset.cat === currentCat ? ' active' : '');
    const ov = items.filter(i => i.cat === t.dataset.cat && !i.done && i.due && dday(i.due) < 0).length;
    const b = document.getElementById(`badge-${t.dataset.cat}`);
    b.textContent = ov; b.style.display = ov > 0 ? 'flex' : 'none';
  });
}

function renderStats() {
  const ci = items.filter(i => i.cat === currentCat);
  if (currentCat === 'pray') {
    const n = s => ci.filter(i => prayStatus(i) === s).length;
    const prayPills = [
      { key:'praying',  num:n('praying'),  lbl:'🙏 기도중', cls:'' },
      { key:'answered', num:n('answered'), lbl:'✅ 응답',   cls:'' },
      { key:'all',      num:ci.length,     lbl:'전체',      cls:'' },
    ];
    if (n('closed') > 0) prayPills.push({ key:'closed', num:n('closed'), lbl:'종료', cls:'' });
    document.getElementById('stats').innerHTML = prayPills.map(p => `
      <div class="stat-pill ${p.cls}${currentFilter===p.key?' active':''}" onclick="setFilter('${p.key}')">
        <div class="stat-num">${p.num}</div>
        <div class="stat-lbl">${p.lbl}</div>
      </div>`).join('');
    return;
  }
  const done = ci.filter(i => i.done).length;
  const shipping = ci.filter(isShipping).length;
  const active = ci.filter(i => !i.done && !isShipping(i)).length;
  const overdue = ci.filter(i => !i.done && i.due && dday(i.due) < 0).length;
  const pills = [
    { key: 'active', num: active, lbl: '진행 중', cls: '' },
    { key: 'all',    num: ci.length, lbl: '전체', cls: '' },
    { key: 'done',   num: done,   lbl: '완료',   cls: '' },
  ];
  if (shipping > 0) pills.splice(1, 0, { key: 'shipping', num: shipping, lbl: '📦 배송중', cls: '' });
  if (overdue > 0) pills.push({ key: 'overdue', num: overdue, lbl: '⚠️ 기한초과', cls: 'overdue-pill' });
  document.getElementById('stats').innerHTML = pills.map(p => `
    <div class="stat-pill ${p.cls}${currentFilter===p.key?' active':''}" onclick="setFilter('${p.key}')">
      <div class="stat-num">${p.num}</div>
      <div class="stat-lbl">${p.lbl}</div>
    </div>`).join('');
}

function renderForm() {
  const cat = currentCat;
  let extra = '';
  if (cat==='shop') extra = `<input type="number" id="qty" placeholder="수량" min="1" style="flex:.8;min-width:70px" onkeydown="if(event.key==='Enter')addItem()"/>`
    + `<label class="ship-check"><input type="checkbox" id="ship" /> 📦 택배</label>`;
  if (cat==='work') extra = `<select id="priority"><option value="">우선순위</option><option value="high">🔴 높음</option><option value="medium">🟡 보통</option><option value="low">🟢 낮음</option></select>`;
  if (cat==='media') extra = `<select id="mediaType"><option value="book">📚 책</option><option value="movie">🎬 드라마/영화</option><option value="show">🎭 공연</option><option value="exhibit">🖼️ 전시</option></select>`;
  document.getElementById('addForm').innerHTML = `
    <div class="row">
      <input type="text" id="newText"
        placeholder="${{shop:'살 것 추가...',life:'할 일 추가...',work:'업무 추가...',media:'제목 추가...',place:'장소 추가...',pray:'기도 제목 추가...'}[cat]||'추가...'}"
        onkeydown="if(event.key==='Enter')addItem()" />
      ${extra}
    </div>
    <div class="row" id="dueDateRow" style="display:none">
      <input type="date" id="dueDate" style="flex:1" />
      <button class="due-cancel-btn" onclick="hideDueDate()">취소</button>
    </div>
    <div class="row">
      ${cat!=='shop'?`<button class="due-chip-btn no-due" onclick="showDueDate()" id="addDueBtn" style="align-self:center">+ 기한</button>`:''}
      <button class="add-btn" onclick="addItem()" style="flex:1">+ 추가</button>
    </div>`;
  if (autoFocusForm) { setTimeout(() => document.getElementById('newText')?.focus(), 50); autoFocusForm = false; }
}

function getFiltered() {
  let filtered = items.filter(i => i.cat === currentCat);
  if (currentCat === 'pray') {
    if (['praying','answered','closed'].includes(currentFilter))
      filtered = filtered.filter(i => prayStatus(i) === currentFilter);
    return filtered.sort((a,b) => new Date(b.created) - new Date(a.created));
  }
  if (currentFilter==='active')   filtered = filtered.filter(i => !i.done && !isShipping(i));
  if (currentFilter==='shipping') filtered = filtered.filter(i => isShipping(i));
  if (currentFilter==='done')     filtered = filtered.filter(i => i.done);
  if (currentFilter==='overdue') filtered = filtered.filter(i => !i.done && i.due && dday(i.due) < 0);
  filtered.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const da = a.due ? dday(a.due) : 9999, db = b.due ? dday(b.due) : 9999;
    if (da !== db) return da - db;
    return new Date(b.created) - new Date(a.created);
  });
  return filtered;
}

function renderList() {
  let filtered = getFiltered();
  const container = document.getElementById('itemsList');
  if (!filtered.length) {
    const msgs = { active:['아직 할 일이 없어요!','새 항목을 추가해 보세요 🍋'], shipping:['기다리는 택배가 없어요','택배 항목을 주문 완료하면 여기 모여요 📦'], done:['완료된 항목이 없어요','체크해서 완료 처리해 보세요 ✔️'], overdue:['기한 초과 없음!','모두 제때 처리하고 있어요 🎉'], praying:['기도 제목이 없어요','마음에 있는 것을 적어보세요 🙏'], answered:['아직 응답 기록이 없어요','응답받은 기도가 여기 모여요 ✨'], closed:['종료한 기도가 없어요','',], all:['아무것도 없어요!','첫 항목을 추가해 보세요 🍋'] };
    const [t,s] = msgs[currentFilter]||msgs.all;
    container.innerHTML = `<div class="empty-state"><span class="e">🌸</span><strong>${t}</strong><br><span style="font-size:.82rem">${s}</span></div>`;
    return;
  }
  container.innerHTML = filtered.map(item => {
    const dd = item.due ? ddayLabel(item.due) : null;
    const over = item.due && dday(item.due) < 0 && !item.done;
    let chips = `<span class="meta-chip">${elapsed(item.created)}</span>`;
    chips += item.due
      ? `<button class="due-chip-btn" onclick="openDueEdit('${item.id}')">${formatDate(item.due)}</button>`
      : `<button class="due-chip-btn no-due" onclick="openDueEdit('${item.id}')">+ 기한</button>`;
    if (dd && !item.done) chips += `<span class="dday-chip ${dd.cls}">${dd.text}</span>`;
    if (item.qty)        chips += `<span class="qty-badge">수량 ${item.qty}개</span>`;
    if (item.cat === 'work') {
      chips += item.priority
        ? `<button class="pri-chip-btn priority-${item.priority}" onclick="openPriEdit('${item.id}')">${PRI_LABEL[item.priority]}</button>`
        : `<button class="due-chip-btn no-due" onclick="openPriEdit('${item.id}')">+ 중요도</button>`;
    } else if (item.priority) {
      chips += `<span class="sub-chip priority-${item.priority}">${PRI_LABEL[item.priority]}</span>`;
    }
    if (item.mediaType)  chips += `<span class="sub-chip media-${item.mediaType}">${{movie:'🎬 드라마/영화',show:'🎭 공연',exhibit:'🖼️ 전시',book:'📚 책',drama:'🎬 드라마/영화'}[item.mediaType]||item.mediaType}</span>`;
    if (item.cat === 'pray') {
      const st = prayStatus(item);
      const notes = noteList(item);
      chips += `<button class="pray-chip-btn pray-${st}" onclick="openPrayEdit('${item.id}')">${PRAY_LABEL[st]}${st==='answered'&&item.answered?' · '+formatDate(item.answered):''}</button>`;
      chips += notes.length
        ? `<button class="due-chip-btn" onclick="toggleNotes('${item.id}')">📝 기록 ${notes.length}개</button>`
        : `<button class="due-chip-btn no-due" onclick="toggleNotes('${item.id}')">+ 기록</button>`;
    }
    if (item.cat === 'shop') {
      if (item.ordered) {
        const mall = item.mall ? escHtml(item.mall) + ' · ' : '';
        chips += `<button class="ship-chip-btn${item.done?' arrived':''}" onclick="openShipEdit('${item.id}')">${item.done?'📦 도착':'📦 배송중'} · ${mall}${formatDate(item.ordered)} 주문</button>`;
      } else if (item.ship && !item.done) {
        chips += `<button class="ship-chip-btn" onclick="toggleShip('${item.id}')" title="눌러서 택배 해제">📦 택배</button>`;
      } else if (!item.ship && !item.done) {
        chips += `<button class="due-chip-btn no-due" onclick="toggleShip('${item.id}')">+ 택배</button>`;
      }
    }
    const isSel = selectedIds.has(item.id);
    return `
      <div class="item-card${item.done?' done':''}${over?' overdue':''}${item.cat==='pray'&&prayStatus(item)==='answered'?' pray-answered':''}${selectMode?' selectable':''}${isSel?' sel-selected':''}"
        data-id="${item.id}"
        ${selectMode?`onclick="toggleSelect('${item.id}')"`:''}>
        ${selectMode
          ? `<div class="item-select-check">${isSel?'✓':''}</div>`
          : item.cat === 'pray'
            ? `<button class="check-btn${prayStatus(item)==='answered'?' answered':''}${item.done?' checked':''}" onclick="togglePray('${item.id}')" title="응답 표시"></button>`
            : `<button class="check-btn${item.done?' checked':''}" onclick="toggleDone('${item.id}')"></button>`}
        <div class="item-body">
          <div class="item-text${item.done?' done-text':''}" ${selectMode?'':`onclick="startEditText('${item.id}')" title="클릭하여 수정"`}>${escHtml(item.text)}</div>
          <div class="text-edit-row" id="text-edit-${item.id}" style="display:none">
            <input type="text" id="text-input-${item.id}" value="${escHtml(item.text)}"
              onkeydown="if(event.key==='Enter')saveText('${item.id}');if(event.key==='Escape')closeTextEdit('${item.id}')" />
            <button class="due-save-btn" onclick="saveText('${item.id}')">저장</button>
            <button class="due-cancel-btn" onclick="closeTextEdit('${item.id}')">취소</button>
          </div>
          <div class="item-meta">${chips}</div>
          <div class="due-edit-row" id="due-edit-${item.id}" style="display:none">
            <input type="date" id="due-input-${item.id}" value="${item.due||''}" />
            <button class="due-save-btn" onclick="saveDue('${item.id}')">저장</button>
            <button class="due-clear-btn" onclick="clearDue('${item.id}')">기한 삭제</button>
            <button class="due-cancel-btn" onclick="closeDueEdit('${item.id}')">취소</button>
          </div>
          <div class="due-edit-row" id="pri-edit-${item.id}" style="display:none">
            <button class="due-save-btn" onclick="setPri('${item.id}','high')">🔴 높음</button>
            <button class="due-save-btn" onclick="setPri('${item.id}','medium')">🟡 보통</button>
            <button class="due-save-btn" onclick="setPri('${item.id}','low')">🟢 낮음</button>
            <button class="due-clear-btn" onclick="setPri('${item.id}','')">없음</button>
            <button class="due-cancel-btn" onclick="closePriEdit('${item.id}')">취소</button>
          </div>
          <div class="due-edit-row" id="ship-edit-${item.id}" style="display:none">
            <input type="text" id="mall-input-${item.id}" value="${escHtml(item.mall||'')}" placeholder="쇼핑몰명"
              onkeydown="if(event.key==='Enter')saveShip('${item.id}');if(event.key==='Escape')closeShipEdit('${item.id}')" />
            <input type="date" id="ordered-input-${item.id}" value="${item.ordered||''}" title="주문한 날짜" />
            <button class="due-save-btn" onclick="saveShip('${item.id}')">저장</button>
            <button class="due-clear-btn" onclick="cancelOrder('${item.id}')">주문 취소</button>
            <button class="due-cancel-btn" onclick="closeShipEdit('${item.id}')">닫기</button>
          </div>
          <div class="due-edit-row" id="pray-edit-${item.id}" style="display:none">
            <button class="due-save-btn" onclick="setPrayStatus('${item.id}','praying')">🙏 기도중</button>
            <button class="due-save-btn" onclick="setPrayStatus('${item.id}','answered')">✅ 응답</button>
            <button class="due-clear-btn" onclick="setPrayStatus('${item.id}','closed')">종료</button>
            <button class="due-cancel-btn" onclick="closePrayEdit('${item.id}')">닫기</button>
          </div>
          ${item.cat === 'pray' ? `
          <div class="notes-panel" id="notes-${item.id}" style="display:${notesOpen.has(item.id)?'block':'none'}">
            ${noteList(item).map((n, idx) => `
              <div class="note-item">
                <span class="note-date">${formatDate(n.createdAt)}</span>
                <span class="note-text">${escHtml(n.text)}</span>
                <button class="note-del" onclick="deleteNote('${item.id}',${idx})" title="메모 삭제">×</button>
              </div>`).join('')}
            <div class="note-add">
              <input type="text" id="note-input-${item.id}" placeholder="짧게 한 줄 남겨도 좋아요"
                onkeydown="if(event.key==='Enter')addNote('${item.id}')" />
              <button class="due-save-btn" onclick="addNote('${item.id}')">기록</button>
            </div>
          </div>` : ''}
        </div>
        ${selectMode ? '' : `<button class="delete-btn" onclick="deleteItem('${item.id}')">×</button>`}
      </div>`;
  }).join('');
}

// ── 액션 ─────────────────────────────────────────────────
async function addItem() {
  const textEl = document.getElementById('newText');
  const text = textEl?.value.trim();
  if (!text) { textEl?.focus(); return; }
  const item = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    cat: currentCat, text,
    due:       document.getElementById('dueDate')?.value || '',
    qty:       document.getElementById('qty')?.value ? parseInt(document.getElementById('qty').value) : null,
    priority:  document.getElementById('priority')?.value || null,
    mediaType: document.getElementById('mediaType')?.value || null,
    ship:      document.getElementById('ship')?.checked || false,
    ordered:   null,
    mall:      null,
    status:    currentCat === 'pray' ? 'praying' : null,
    answered:  null,
    notes:     [],
    done: false, created: todayStr(),
  };
  items.unshift(item);
  currentFilter = defaultFilter(item.cat);
  if (currentCat !== item.cat) currentCat = item.cat;
  render();
  // render()가 입력 폼을 통째로 다시 그려서 입력창 요소가 교체된다.
  // 연속 입력이 끊기지 않게 새 입력창으로 포커스를 되돌린다.
  // (await 앞이라 사용자 조작 흐름 안에서 실행 → 모바일 자판도 내려가지 않음)
  document.getElementById('newText')?.focus();
  await dbAdd(item);
}
async function toggleDone(id) {
  const i = items.find(i=>i.id===id);
  if (!i) return;
  // 택배 항목: 진행 중 → (주문함) 배송중 → 완료
  if (i.ship && !i.done && !i.ordered) {
    const mall = prompt('어디서 주문했어요? (쇼핑몰명)', '');
    if (mall === null) return;
    i.ordered = todayStr();
    i.mall = mall.trim() || null;
    render();
    await dbUpdate(id, { ordered: i.ordered, mall: i.mall });
    return;
  }
  i.done = !i.done;
  render();
  await dbUpdate(id, { done: i.done });
}
function isShipping(i) { return i.ship && i.ordered && !i.done; }
async function deleteItem(id) {
  const item = items.find(i=>i.id===id); if(!item) return;
  const label = item.text.length>20 ? item.text.slice(0,20)+'…' : item.text;
  if(!confirm(`"${label}" 을(를) 삭제할까요?`)) return;
  items = items.filter(i=>i.id!==id); render();
  await dbDelete(id);
}
function showDueDate() {
  document.getElementById('dueDateRow').style.display='flex';
  document.getElementById('addDueBtn').style.display='none';
  document.getElementById('dueDate')?.focus();
}
function hideDueDate() {
  document.getElementById('dueDateRow').style.display='none';
  document.getElementById('addDueBtn').style.display='';
  const d = document.getElementById('dueDate');
  if (d) d.value = '';
}
// 기도 탭은 '진행 중' 대신 '기도중'이 기본 필터
function defaultFilter(cat) { return cat === 'pray' ? 'praying' : 'active'; }
function switchCat(cat) { currentCat=cat; currentFilter=defaultFilter(cat); autoFocusForm=true; render(); }
function setFilter(f) { currentFilter=f; render(); }
function openDueEdit(id) { document.getElementById(`due-edit-${id}`).style.display='flex'; document.getElementById(`due-input-${id}`)?.focus(); }
function closeDueEdit(id) { document.getElementById(`due-edit-${id}`).style.display='none'; }
async function saveDue(id) {
  const i = items.find(i=>i.id===id);
  if (i) { i.due=document.getElementById(`due-input-${id}`)?.value||''; render(); await dbUpdate(id, {due: i.due}); }
}
async function clearDue(id) {
  const i = items.find(i=>i.id===id);
  if (i) { i.due=''; render(); await dbUpdate(id, {due: ''}); }
}
function startEditText(id) {
  const el = document.getElementById(`text-edit-${id}`);
  const textEl = document.getElementById(`text-input-${id}`);
  if (!el) return;
  el.style.display='flex';
  textEl?.focus(); textEl?.select();
}
function closeTextEdit(id) {
  const el = document.getElementById(`text-edit-${id}`);
  if (el) el.style.display='none';
}
function openShipEdit(id) {
  const el = document.getElementById(`ship-edit-${id}`);
  if (!el) return;
  el.style.display = 'flex';
  const inp = document.getElementById(`mall-input-${id}`);
  inp?.focus(); inp?.select();
}
function closeShipEdit(id) {
  const el = document.getElementById(`ship-edit-${id}`);
  if (el) el.style.display = 'none';
}
async function saveShip(id) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  i.mall = document.getElementById(`mall-input-${id}`)?.value.trim() || null;
  const d = document.getElementById(`ordered-input-${id}`)?.value;
  if (d) i.ordered = d;   // 비워두면 기존 날짜 유지 (되돌리기는 "주문 취소")
  render();
  await dbUpdate(id, { mall: i.mall, ordered: i.ordered });
}
// 택배 여부 켜기/끄기 (나중에도 바꿀 수 있게)
async function toggleShip(id) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  i.ship = !i.ship;
  if (!i.ship) { i.ordered = null; i.mall = null; }
  render();
  await dbUpdate(id, { ship: i.ship, ordered: i.ordered, mall: i.mall });
}
async function cancelOrder(id) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  if (!confirm('주문을 취소하고 진행 중으로 돌릴까요?')) return;
  i.ordered = null; i.mall = null; i.done = false;
  render();
  await dbUpdate(id, { ordered: null, mall: null, done: false });
}

// ── 기도 리스트 ───────────────────────────────────────────
// 기도중 / 응답 / 종료 3가지 상태.
// 응답은 "나중에 다시 볼 기록"이라 흐리게 처리하지 않고(done=false),
// 종료만 다른 카테고리의 완료와 같은 취소선·흐림 처리(done=true)를 받는다.
const PRAY_LABEL = { praying:'🙏 기도중', answered:'✅ 응답', closed:'종료' };

function prayStatus(i) { return i.status || (i.done ? 'closed' : 'praying'); }
function noteList(i) { return Array.isArray(i.notes) ? i.notes : []; }

async function setPrayStatus(id, status) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  i.status = status;
  i.done = (status === 'closed');       // 종료만 흐림 처리
  if (status === 'answered' && !i.answered) i.answered = todayStr();
  if (status === 'praying') i.answered = null;
  render();
  await dbUpdate(id, { status: i.status, done: i.done, answered: i.answered });
}

// 동그라미 버튼: 기도중 ↔ 응답 (종료는 상태 칩에서)
function togglePray(id) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  setPrayStatus(id, prayStatus(i) === 'answered' ? 'praying' : 'answered');
}

function openPrayEdit(id) {
  const el = document.getElementById(`pray-edit-${id}`);
  if (el) el.style.display = 'flex';
}
function closePrayEdit(id) {
  const el = document.getElementById(`pray-edit-${id}`);
  if (el) el.style.display = 'none';
}

// 메모 패널은 다시 렌더링돼도 열린 상태가 유지돼야 해서 따로 기억해 둔다
function toggleNotes(id) {
  if (notesOpen.has(id)) notesOpen.delete(id);
  else notesOpen.add(id);
  render();
  if (notesOpen.has(id)) setTimeout(() => document.getElementById(`note-input-${id}`)?.focus(), 50);
}

// 메모는 누적형. 응답 날짜와 별개로 각 메모의 작성 날짜를 따로 기록한다.
async function addNote(id) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  const inp = document.getElementById(`note-input-${id}`);
  const text = inp?.value.trim();
  if (!text) { inp?.focus(); return; }
  i.notes = [...noteList(i), { text, createdAt: todayStr() }];
  notesOpen.add(id);
  render();
  await dbUpdate(id, { notes: i.notes });
}
async function deleteNote(id, idx) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  const list = noteList(i);
  if (!list[idx]) return;
  if (!confirm('이 메모를 지울까요?')) return;
  i.notes = list.filter((_, n) => n !== idx);
  notesOpen.add(id);
  render();
  await dbUpdate(id, { notes: i.notes });
}

const PRI_LABEL = { high:'🔴 높음', medium:'🟡 보통', low:'🟢 낮음' };

function openPriEdit(id) {
  const el = document.getElementById(`pri-edit-${id}`);
  if (el) el.style.display = 'flex';
}
function closePriEdit(id) {
  const el = document.getElementById(`pri-edit-${id}`);
  if (el) el.style.display = 'none';
}
async function setPri(id, val) {
  const i = items.find(i => i.id === id);
  if (!i) return;
  i.priority = val || null;
  render();
  await dbUpdate(id, { priority: val || null });
}

const CATS = [
  { key:'shop',  label:'쇼핑',     icon:'🛒' },
  { key:'life',  label:'라이프',   icon:'🌿' },
  { key:'work',  label:'업무',     icon:'💼' },
  { key:'media', label:'보고싶은것', icon:'🎬' },
  { key:'place', label:'가고싶은곳', icon:'📍' },
  { key:'pray',  label:'기도',       icon:'🙏' },
];

function enterSelectMode() { selectMode=true; selectedIds.clear(); render(); }
function exitSelectMode() {
  selectMode=false; selectedIds.clear();
  document.getElementById('movePanel')?.remove();
  render();
}

function openMovePanel() {
  document.getElementById('movePanel')?.remove();
  const panel = document.createElement('div');
  panel.id = 'movePanel';
  panel.className = 'move-panel';
  panel.innerHTML = `
    <h4>${selectedIds.size}개 항목을 이동할 카테고리 선택</h4>
    <div class="move-cat-list">
      ${CATS.map(c => `
        <button class="move-cat-btn${c.key===currentCat?' current':''}" onclick="moveSelected('${c.key}')">
          ${c.icon} ${c.label}${c.key===currentCat?' (현재)':''}
        </button>`).join('')}
    </div>
    <button class="move-cancel" onclick="document.getElementById('movePanel').remove()">취소</button>`;
  document.body.appendChild(panel);
}

async function moveSelected(toCat) {
  if (!selectedIds.size) return;
  const ids = [...selectedIds];
  ids.forEach(id => {
    const item = items.find(i => i.id === id);
    if (item) item.cat = toCat;
  });
  document.getElementById('movePanel')?.remove();
  exitSelectMode();
  await Promise.all(ids.map(id => dbUpdate(id, { cat: toCat })));
}
function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  renderToolbar();
  document.querySelectorAll('.item-card.selectable').forEach(el => {
    const elId = el.querySelector('.item-select-check') ? el.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] : null;
  });
  renderList(); lucide.createIcons();
}
function toggleSelectAll() {
  const visible = getFiltered().map(i => i.id);
  const allSel = visible.every(id => selectedIds.has(id));
  if (allSel) visible.forEach(id => selectedIds.delete(id));
  else visible.forEach(id => selectedIds.add(id));
  renderToolbar(); renderList(); lucide.createIcons();
}
async function deleteSelected() {
  if (!selectedIds.size) return;
  if (!confirm(`선택한 ${selectedIds.size}개를 삭제할까요?`)) return;
  const ids = [...selectedIds];
  items = items.filter(i => !selectedIds.has(i.id));
  exitSelectMode();
  await Promise.all(ids.map(id => dbDelete(id)));
}

async function bulkDeleteDone() {
  const doneItems = items.filter(i => i.cat === currentCat && i.done);
  if (!doneItems.length) return;
  if (!confirm(`완료된 항목 ${doneItems.length}개를 모두 삭제할까요?`)) return;
  const ids = doneItems.map(i => i.id);
  items = items.filter(i => !(i.cat === currentCat && i.done));
  render();
  await Promise.all(ids.map(id => dbDelete(id)));
}

async function saveText(id) {
  const i = items.find(i=>i.id===id);
  const val = document.getElementById(`text-input-${id}`)?.value.trim();
  if (i && val) { i.text=val; render(); await dbUpdate(id, {text: val}); }
  else closeTextEdit(id);
}
function escHtml(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── 비밀번호 잠금 ─────────────────────────────────────────
const LOCK_PW = 'lemonj3379*';

function tryUnlock() {
  const val = document.getElementById('pwInput')?.value;
  if (val === LOCK_PW) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    loadItems();
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryUnlock();
});
setTimeout(() => document.getElementById('pwInput').focus(), 100);

// ── 초기화 ────────────────────────────────────────────────
applyTheme(currentTheme);
render();

// ── PWA 서비스 워커 등록 ──────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
